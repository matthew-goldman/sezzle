# .github/workflows/terraform-unlock.yml
name: "[Terraform] Unlock State"

on:
  workflow_dispatch:
    inputs:
      lock_id:
        description: 'Lock ID to remove (e.g., abc123-def456-...)'
        required: true
        type: string
      environment:
        description: 'Environment (dev/staging/prod)'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  unlock-state:
    name: Unlock Terraform State
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-2
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.4
    
    - name: Initialize Terraform
      working-directory: ./deployments/terraform
      run: terraform init
    
    - name: Unlock Terraform State
      working-directory: ./deployments/terraform
      run: |
        echo "🔓 Unlocking Terraform state..."
        echo "Lock ID: ${{ inputs.lock_id }}"
        echo "Environment: ${{ inputs.environment }}"
        
        terraform force-unlock -force ${{ inputs.lock_id }}
        
        if [ $? -eq 0 ]; then
          echo "✅ State unlocked successfully!"
        else
          echo "❌ Failed to unlock state"
          exit 1
        fi
    
    - name: Verify State
      working-directory: ./deployments/terraform
      run: |
        echo "Verifying state is accessible..."
        terraform state list || echo "State is locked or empty"
