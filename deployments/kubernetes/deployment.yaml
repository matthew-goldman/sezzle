apiVersion: v1
kind: Namespace
metadata:
  name: weather-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-service-config
  namespace: weather-service
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  SERVER_PORT: "8080"
  CACHE_TYPE: "redis"
  CACHE_TTL: "5m"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_RPS: "100"
  RATE_LIMIT_BURST: "200"
---
apiVersion: v1
kind: Secret
metadata:
  name: weather-service-secrets
  namespace: weather-service
type: Opaque
stringData:
  OPENWEATHER_API_KEY: "YOUR_API_KEY_HERE"  # Replace with actual key or use sealed-secrets
  REDIS_PASSWORD: ""  # If Redis requires authentication
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-service
  namespace: weather-service
  labels:
    app: weather-service
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: weather-service
  template:
    metadata:
      labels:
        app: weather-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: weather-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: weather-service
        image: matthewgoldman/weather-service:latest  # Update with your registry
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: weather-service-config
        - secretRef:
            name: weather-service-secrets
        
        env:
        - name: REDIS_ADDR
          value: "redis-service:6379"
        
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        lifecycle:
          preStop:
            exec:
              # Give time for graceful shutdown
              command: ["/bin/sh", "-c", "sleep 15"]
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: weather-service
  namespace: weather-service
  labels:
    app: weather-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: weather-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weather-service
  namespace: weather-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: weather-service
  namespace: weather-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: weather-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: weather-service
  namespace: weather-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: weather-service
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-service
  namespace: weather-service
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - weather.example.com
    secretName: weather-service-tls
  rules:
  - host: weather.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: weather-service
            port:
              number: 80
---
# Redis deployment (for dev/staging - use managed Redis in production)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: weather-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: weather-service
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
