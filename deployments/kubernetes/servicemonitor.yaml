apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: weather-service
  namespace: weather-service
  labels:
    app: weather-service
    release: prometheus
spec:
  selector:
    matchLabels:
      app: weather-service
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: weather-service-alerts
  namespace: weather-service
  labels:
    app: weather-service
    release: prometheus
spec:
  groups:
  - name: weather-service
    interval: 30s
    rules:
    - alert: HighErrorRate
      expr: |
        (
          sum(rate(weather_request_success_total{success="false"}[5m]))
          /
          sum(rate(weather_request_success_total[5m]))
        ) > 0.01
      for: 5m
      labels:
        severity: critical
        component: weather-service
      annotations:
        summary: "High error rate detected"
        description: "Error rate is {{ $value | humanizePercentage }}"
    
    - alert: HighLatency
      expr: |
        histogram_quantile(0.99, 
          sum(rate(weather_http_request_duration_seconds_bucket[5m])) by (le, endpoint)
        ) > 1.0
      for: 5m
      labels:
        severity: warning
        component: weather-service
      annotations:
        summary: "High P99 latency"
        description: "P99 latency is {{ $value }}s"
