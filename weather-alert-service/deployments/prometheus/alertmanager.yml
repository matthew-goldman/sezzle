global:
  resolve_timeout: 5m
  # PagerDuty integration key (set via environment variable)
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Templates for alert notifications
templates:
  - '/etc/alertmanager/*.tmpl'

# Route tree for alert routing
route:
  # Default receiver for all alerts
  receiver: 'slack-notifications'
  
  # Group alerts by cluster and alertname for efficient notification
  group_by: ['cluster', 'alertname', 'severity']
  
  # Wait 30s before sending notification to allow grouping
  group_wait: 30s
  
  # Wait 5m before sending notification about new alerts in same group
  group_interval: 5m
  
  # Wait 4h before resending an alert
  repeat_interval: 4h

  # Child routes with specific routing rules
  routes:
    # Critical alerts go to PagerDuty for immediate response
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      group_wait: 10s
      repeat_interval: 1h
      continue: true  # Also send to Slack
    
    # Alerts tagged for PagerDuty
    - match:
        pagerduty: "true"
      receiver: 'pagerduty-critical'
      group_wait: 10s
      repeat_interval: 1h
    
    # Warning alerts only to Slack
    - match:
        severity: warning
      receiver: 'slack-notifications'
      group_wait: 30s
      repeat_interval: 4h

# Inhibition rules to suppress redundant alerts
inhibit_rules:
  # If ServiceDown is firing, suppress all other alerts for that service
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['job', 'instance']
  
  # If UpstreamAPIDown is firing, suppress UpstreamAPIHighErrorRate
  - source_match:
      alertname: 'UpstreamAPIDown'
    target_match:
      alertname: 'UpstreamAPIHighErrorRate'
    equal: ['component']
  
  # Critical alerts suppress warnings for the same component
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['component', 'alertname']

# Receivers define where to send notifications
receivers:
  # Slack notifications for all alerts
  - name: 'slack-notifications'
    slack_configs:
      - api_url: '<SLACK_WEBHOOK_URL>'  # Set via environment or secret
        channel: '#weather-service-alerts'
        title: 'Weather Service Alert - {{ .GroupLabels.severity | toUpper }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Component:* {{ .Labels.component }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}{{ if eq .GroupLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'

  # PagerDuty for critical incidents
  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '<PAGERDUTY_SERVICE_KEY>'  # Set via environment or secret
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        details:
          severity: '{{ .GroupLabels.severity }}'
          num_firing: '{{ .Alerts.Firing | len }}'
          alerts: |
            {{ range .Alerts }}
            - {{ .Labels.alertname }}: {{ .Annotations.description }}
            {{ end }}
        client: 'Prometheus'
        client_url: 'https://prometheus.example.com'
        send_resolved: true

  # Email notifications (optional)
  - name: 'email-notifications'
    email_configs:
      - to: 'sre-team@example.com'
        from: 'alertmanager@example.com'
        smarthost: 'smtp.gmail.com:587'
        auth_username: '<SMTP_USERNAME>'
        auth_password: '<SMTP_PASSWORD>'
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        html: |
          <h2>Weather Service Alert</h2>
          {{ range .Alerts }}
          <h3>{{ .Labels.alertname }}</h3>
          <p><strong>Severity:</strong> {{ .Labels.severity }}</p>
          <p><strong>Component:</strong> {{ .Labels.component }}</p>
          <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          {{ if .Annotations.runbook_url }}<p><a href="{{ .Annotations.runbook_url }}">Runbook</a></p>{{ end }}
          <hr>
          {{ end }}
        send_resolved: true

  # Null receiver for alerts we want to suppress completely
  - name: 'null'

