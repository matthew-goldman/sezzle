global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'weather-service-prod'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alerting rules
rule_files:
  - /etc/prometheus/rules.yml

# Scrape configurations
scrape_configs:
  # Weather service metrics
  - job_name: 'weather-service'
    static_configs:
      - targets:
          - 'weather-service:8080'
    metrics_path: '/metrics'
    scrape_interval: 10s
    
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  # Node exporter (for system metrics)
  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'

# Remote write for long-term storage (optional - e.g., to Grafana Cloud, Thanos, etc.)
# remote_write:
#   - url: "https://prometheus-prod-us-central-0.grafana.net/api/prom/push"
#     basic_auth:
#       username: <instance_id>
#       password: <api_key>
